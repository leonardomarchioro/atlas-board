<!-- Micro-interaction Scripts -->
<script>
        // Simple Color Picker Toggle Logic
        const colorButtons = document.querySelectorAll('.color-dot-active, [title]');
        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                colorButtons.forEach(b => b.classList.remove('color-dot-active'));
                btn.classList.add('color-dot-active');
            });
        });

        // Close Modal Animation Mock
        const closeBtn = document.querySelector('button .material-symbols-outlined:first-child');
        const prontoBtn = document.querySelector('.bg-surface-variant.text-on-surface');
        
        const closeModal = () => {
            const modal = document.querySelector('.animate-in');
            const overlay = document.querySelector('.modal-overlay');
            modal.classList.add('scale-95', 'opacity-0');
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                alert('Modal Fechado (Mock)');
                // In a real app, this would remove the element or change state
                modal.classList.remove('scale-95', 'opacity-0');
                overlay.classList.remove('opacity-0');
            }, 300);
        };

        if(closeBtn) closeBtn.parentElement.addEventListener('click', closeModal);
        if(prontoBtn) prontoBtn.addEventListener('click', closeModal);
    </script>
